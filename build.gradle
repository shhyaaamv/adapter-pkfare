
plugins {
    id "io.spring.dependency-management" version "1.1.7"
    id "org.sonarqube" version "6.2.0.5505"
    id "jacoco"
}

allprojects {
    group = 'com.verteil'
    version = '0.0.1-SNAPSHOT'


    ext {
        geolocationDataVersion = '1.7.0'
        grpcVersion = '1.71.0'
        lombokVersion='1.18.38'
        springBootVersion = '3.5.6'
        vdcConfiguratorClientVersion = '3.11.0'
        verteilCommonsCoreVersion = '5.1.1'
        verteilInfraNotifierVersion = '2.0.0'
        verteilndcSchemaVersion = '1.52.0'
        verteilThirdPartiesCommonVersion = '3.48.0'
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url 'https://vdc-repository-683455398069.d.codeartifact.ap-south-1.amazonaws.com/maven/libs-snapshot-local/'
            credentials {
                username = "aws"
                password = System.getenv("CODEARTIFACT_AUTH_TOKEN")
            }
            mavenContent { snapshotsOnly() }
        }
        maven {
            url 'https://vdc-repository-683455398069.d.codeartifact.ap-south-1.amazonaws.com/maven/libs-release-local/'
            credentials {
                username = "aws"
                password = System.getenv("CODEARTIFACT_AUTH_TOKEN")
            }
            mavenContent { releasesOnly() }
        }
    }
}



subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'
    apply plugin: 'org.sonarqube'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports { mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}" }
    }

    dependencies {
        implementation 'org.springframework.security:spring-security-core:6.4.2'
        implementation ("com.verteil:verteil-commons-logmask:4.4.0"){
            transitive = false
        }

        implementation ("com.verteil:vdc-thirdparties-common-schema-ndc:${verteilndcSchemaVersion}"){
            transitive = false
        }
        implementation "com.verteil:verteil-commons-core:${verteilCommonsCoreVersion}"


        compileOnly("org.projectlombok:lombok:${lombokVersion}")
        annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

        testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
        testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    }

    jacoco {
        toolVersion = "0.8.14"
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                groupId = "$project.group"
                artifactId = "$project.name"
                version = "$project.version"
                from components.java
            }
        }
        repositories {
            maven {
                name = 'snapshot'
                url = 'https://vdc-repository-683455398069.d.codeartifact.ap-south-1.amazonaws.com/maven/libs-snapshot-local/'
                credentials {
                    username = "aws"
                    password = System.env.CODEARTIFACT_AUTH_TOKEN
                }
            }
            maven {
                name = 'release'
                url = 'https://vdc-repository-683455398069.d.codeartifact.ap-south-1.amazonaws.com/maven/libs-release-local/'
                credentials {
                    username = "aws"
                    password = System.env.CODEARTIFACT_AUTH_TOKEN
                }
            }
        }
    }

    test {
        useJUnitPlatform()
    }
}