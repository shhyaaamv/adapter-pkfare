plugins {
    id "io.spring.dependency-management" version "1.1.7"
    id "org.sonarqube" version "7.5.0.8588"
    id "jacoco"
}

allprojects {
    group = 'com.verteil'
    version = '0.0.1-SNAPSHOT'


    ext {
        springBootVersion = '3.5.7'
        verteilndcSchemaVersion = '1.52.0'
        verteilThirdPartiesCommonVersion = '3.48.0'
        verteilCommonsCoreVersion = '4.24.0'
        vdcConfiguratorClientVersion = '3.11.0'
        lombokVersion='1.18.38'
        verteilPrometheusMetricVersion = '2.65.0'
        resilience4jVersion = '2.2.0'
        pkfareApiSchemaVersion = '1.2.0-SNAPSHOT'
        httpclientVersion='5.5'
        verteilVersion='1.0'
        junitJupiterVersion = '5.11.4'
        wiremockVersion = '3.13.1'
        cucumberVersion = '7.18.0'
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            url 'https://vdc-repository-683455398069.d.codeartifact.ap-south-1.amazonaws.com/maven/libs-snapshot-local/'
            credentials {
                username = "aws"
                password = System.getenv("CODEARTIFACT_AUTH_TOKEN")
            }
            mavenContent { snapshotsOnly() }
        }
        maven {
            url 'https://vdc-repository-683455398069.d.codeartifact.ap-south-1.amazonaws.com/maven/libs-release-local/'
            credentials {
                username = "aws"
                password = System.getenv("CODEARTIFACT_AUTH_TOKEN")
            }
            mavenContent { releasesOnly() }
        }
    }
}



subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'
    apply plugin: 'org.sonarqube'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    dependencyManagement {
        imports { mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}" }
    }

    dependencies {
        implementation 'org.springframework.security:spring-security-core:6.4.2'
        implementation 'org.apache.commons:commons-collections4:4.4'
        implementation ("com.verteil:verteil-commons-logmask:4.4.0"){
            transitive = false
        }

        implementation ("com.verteil:vdc-thirdparties-common-schema-ndc:${verteilndcSchemaVersion}"){
            transitive = false
        }
        implementation ("com.verteil:vdc-thirdparties-common-schema-vdc:${verteilndcSchemaVersion}"){
            transitive = false
        }
        implementation("com.verteil:verteil-commons-core:${verteilCommonsCoreVersion}") {
            transitive = false
        }
        implementation "javax.ws.rs:javax.ws.rs-api:2.1.1"

        implementation("io.micrometer:micrometer-registry-prometheus:1.14.4")

        implementation ("org.springframework.boot:spring-boot-starter-web") {
            exclude group: 'org.glassfish.jersey.core', module: 'jersey-client'
            exclude group: 'org.glassfish.jersey.core', module: 'jersey-common'
            exclude group: 'org.glassfish.jersey.core', module: 'jersey-server'
            exclude group: 'org.glassfish.jersey.core', module: 'jersey-media-multipart'
        }

        implementation("org.apache.commons:commons-text:1.10.0")

        implementation 'javax.xml.bind:jaxb-api:2.3.1'

        compileOnly("org.projectlombok:lombok:${lombokVersion}")
        annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

        testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
        testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    }

    jacoco {
        toolVersion = "0.8.14"
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                groupId = "$project.group"
                artifactId = "$project.name"
                version = "$project.version"
                from components.java
            }
        }
        repositories {
            maven {
                name = 'snapshot'
                url = 'https://vdc-repository-683455398069.d.codeartifact.ap-south-1.amazonaws.com/maven/libs-snapshot-local/'
                credentials {
                    username = "aws"
                    password = System.env.CODEARTIFACT_AUTH_TOKEN
                }
            }
            maven {
                name = 'release'
                url = 'https://vdc-repository-683455398069.d.codeartifact.ap-south-1.amazonaws.com/maven/libs-release-local/'
                credentials {
                    username = "aws"
                    password = System.env.CODEARTIFACT_AUTH_TOKEN
                }
            }
        }
    }

    test {
        useJUnitPlatform()
    }
}


sonar {
    properties {
        property "sonar.projectKey", "verteiltech_adapter-pkfare"
        property "sonar.organization", "verteiltech"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/report.xml"
        property "sonar.coverage.exclusions", "**/dto/**," +
                "adapter-pkfare-server/src/main/java/com/verteil/thirdparties/adapter/pkfare/**/*," +
                "adapter-pkfare-service/src/main/java/com/verteil/thirdparties/adapter/pkfare/config/**/*," +
                "adapter-pkfare-service/src/main/java/com/verteil/thirdparties/adapter/pkfare/client/**/*," +
                "adapter-pkfare-service/src/main/java/com/verteil/thirdparties/adapter/pkfare/offer/OfferService.java," +
                "**/PkfareAdapterContext.java"
    }
}


tasks.register('codeCoverageReport', JacocoReport) { ->
    executionData fileTree(project.rootDir.absolutePath).include("**/build/jacoco/*.exec")
    subprojects.each {
        sourceSets it.sourceSets.main
    }
    reports {
        xml.required.set(true)
        xml.outputLocation.set(file("${buildDir}/reports/jacoco/report.xml"))
    }
}

codeCoverageReport.dependsOn {
    subprojects*.test
}
