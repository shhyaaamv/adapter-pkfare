server:
      shutdown: graceful
      port: 9022
      forward-headers-strategy: native
      tomcat:
        accesslog:
          enabled: true
          pattern: '%h %l %u %t "%r" adapter-pkfare %{X-SID}i %{X-CID}i %{X-IATA}i %{X-TID}o %s %b %F %{ms}T'
          buffered: true
          directory: /var/log/vdc/adapter-pkfare
          file-date-format: .yyyy-MM-dd
          prefix: adapter-pkfare_access
          suffix: .log
          rotate: true
          rename-on-rotate: true

spring:
  application:
    name: adapter-pkfare
  lifecycle:
    timeout-per-shutdown-phase: 180s
  threads:
    virtual:
      enabled: true

adapter:
  http:
    poolMax: 300
    poolTimeoutMillis: 500
    connectTimeoutMillis: 5000
    responseTimeoutMillis: 180000
  monitor:
    idleTime: 180
    task:
      interval: 30000

pkfare:
  enabled-services:
    search: true
    qte: true
  vendor-codes: []
  ip-whitelist:
    enabled: true
    addresses: []
  message-log:
    enabled: true
    prod-error-monitoring: true
    mask-elements: []
    mask-attributes: []

verteil:
  host:
  path: /entrygate/rest/request
  auth-path: /oauth2/token
  auth-scope: api
  timeout-millis: 30000
  token:
    ttl-seconds: 1800
    lock-lease-millis: 10000
    lock-wait-millis: 6000
    lock-poll-millis: 50
  circuit-breaker:
    failure-rate-threshold: 50
    slow-call-rate-threshold: 100
    slow-call-duration-millis: 30000
    sliding-window-size: 50
    minimum-number-of-calls: 20
    wait-duration-in-open-state-millis: 30000
    permitted-number-of-calls-in-half-open-state: 5

aws:
  secretManager:
    name:
    region: ap-south-1
    url:

ordermanagement:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password:
    database: ${REDIS_DATABASE:0}
    ssl:
      enabled: ${REDIS_SSL_ENABLED:false}
    timeout:
      seconds: 5

management:
  server:
    port: 7045
    accesslog:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
