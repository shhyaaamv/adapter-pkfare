server:
      shutdown: graceful
      port: 9022
      # Resolve the caller IP (logged per request) from X-Forwarded-For only when the hop is a trusted internal proxy
      # (Tomcat RemoteIpValve). Override server.tomcat.remoteip.internal-proxies if the ingress range differs.
      forward-headers-strategy: native
      tomcat:
        accesslog:
          enabled: true
          pattern: '%h %l %u %t "%r" adapter-pkfare %{X-SID}i %{X-CID}i %{X-IATA}i %{X-TID}o %s %b %F %{ms}T'
          buffered: true
          directory: /var/log/vdc/adapter-pkfare
          file-date-format: .yyyy-MM-dd
          prefix: adapter-pkfare_access
          suffix: .log
          rotate: true
          rename-on-rotate: true

spring:
  application:
    name: adapter-pkfare
  lifecycle:
    timeout-per-shutdown-phase: 180s
  threads:
    virtual:
      enabled: true

connector:
  http:
    poolMax: 300
    poolTimeoutMillis: 500
    connectTimeoutMillis: 5000
    responseTimeoutMillis: 180000
  monitor:
    idleTime: 180
    task:
      interval: 30000

adapter:
  search-cache:
    # upper bound on cached shopping results + flights across all cached SEARCH responses (per pod)
    max-weight: 50000

# The only database access: the in-process configurator reads agency_adapter_tbls.pkfare_configs (SELECT only)
# once at startup, and again only on a reload (POST /reload, or a reload broadcast from another pod: see kafka).
agency-adapter:
  datasource:
    url: jdbc:postgresql://localhost:5432/vdc_db?currentSchema=agency_adapter_tbls&ApplicationName=adapter-pkfare
    username: pkfare_user
    password: pkfare123

# Cluster-wide reload: POST /reload re-reads pkfare_configs on the pod it reaches, then publishes the reload to this
# topic; every pod consumes it under a consumer group of its own (<consumer-group>#<uuid>) and re-reads too. A blank
# bootstrapAddress (KAFKA_URL unset) turns the broadcast off: POST /reload then reloads one pod only.
kafka:
  bootstrapAddress: ${KAFKA_URL:}
  configurator-internal:
    topic: ${KAFKA_TOPIC_ADAPTER_PKFARE_CONFIGURATOR_INTERNAL:adapter-pkfare-configurator-internal}
    consumer-group: adapter-pkfare-configurator-cg

# Shared Redis (token cache shared across pods); property names are those read by connector-common's ConnectorRedisConfig
ordermanagement:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password:
    database: ${REDIS_DATABASE:0}
    ssl:
      enabled: ${REDIS_SSL_ENABLED:false}
    timeout:
      seconds: 5

management:
  server:
    port: 7045
    accesslog:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
