plugins {
    id 'application'
    id "org.springframework.boot" version "${springBootVersion}"
}

dependencies {
    implementation project(':connector-pkfare-service')
    implementation("com.fasterxml.jackson.module:jackson-module-jaxb-annotations:2.15.0")
    implementation ("org.springframework.boot:spring-boot-starter-web") {
        exclude group: 'org.glassfish.jersey.core', module: 'jersey-client'
        exclude group: 'org.glassfish.jersey.core', module: 'jersey-common'
        exclude group: 'org.glassfish.jersey.core', module: 'jersey-server'
        exclude group: 'org.glassfish.jersey.core', module: 'jersey-media-multipart'
    }
}

springBoot {
    buildInfo()
}

bootJar {
    enabled = true
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    enabled = false
}

distZip {
    enabled = false
}

distTar {
    enabled = false
}

bootDistZip {
    enabled = false
}

bootDistTar {
    enabled = false
}

startScripts {
    enabled = false
}

bootStartScripts {
    enabled = false
}
