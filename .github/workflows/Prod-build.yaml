name: Build adapter-pkfare for Prod deployment
on:
  release:
    types:
      - created

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: 'ap-south-1'
  APP_DOMAIN: vdc-repository
  DOMAIN_OWNER: 683455398069
jobs:
  build:
    name: "build & deploy to EC2 from Master on Tag push 🚀"
    runs-on: self-hosted-arm64
    steps:
      - name: Check if the release was created from master
        id: check_master
        run: echo ::set-output name=is_master::${{ github.event.release.target_commitish == 'master' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create a release only if it's from master
        if: steps.check_master.outputs.is_master == 'true'
        run: |
          echo "Creating a release from master branch"
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 25
      - name: Get Tag Version
        id: tag
        run: echo "::set-output name=version::$(echo ${{ github.ref }} | cut -d '/' -f 3)"
      - name: Build Jar from master for EC2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain $APP_DOMAIN --domain-owner $DOMAIN_OWNER --query authorizationToken --output text)
          ./gradlew clean build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push version tagged image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: prod-adapter-pkfare
          GIT_TAG: ${{ steps.tag.outputs.version }}
        run: |
          aws ecr get-login-password --region ap-south-1 | sudo buildah login --username AWS --password-stdin 683455398069.dkr.ecr.ap-south-1.amazonaws.com
          sudo buildah --no-cache --isolation=chroot build -t $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_TAG .
          sudo buildah push $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_TAG