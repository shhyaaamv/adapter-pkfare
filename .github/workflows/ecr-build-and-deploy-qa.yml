name: build and deploy adapter-pkfare to ECR
on:
  push:
    branches:
      - develop
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: 'ap-south-1'
  APP_DOMAIN: vdc-repository
  DOMAIN_OWNER: 683455398069
jobs:
  build:
    name: Gradle build
    runs-on: self-hosted-arm64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 25
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain $APP_DOMAIN --domain-owner $DOMAIN_OWNER --query authorizationToken --output text)
          ./gradlew clean build cyclonedxBom
      - name: Git Tag version
        run: echo "GIT_TAG=`echo $(git rev-parse --short=7 HEAD)`" >> $GITHUB_ENV
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: adapter-pkfare
          ECR_REPOSITORY_DB: adapter-pkfare-db-migration
          IMAGE_TAG: latest
        run: |
          aws ecr get-login-password --region ap-south-1 | sudo buildah login --username AWS --password-stdin 683455398069.dkr.ecr.ap-south-1.amazonaws.com
          sudo buildah --no-cache --isolation=chroot build --pull --platform linux/arm64/v8 -f Dockerfile-db-migration -t $ECR_REGISTRY/$ECR_REPOSITORY_DB:$GIT_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_DB:$IMAGE_TAG .
          sudo buildah push $ECR_REGISTRY/$ECR_REPOSITORY_DB:$GIT_TAG
          sudo buildah push $ECR_REGISTRY/$ECR_REPOSITORY_DB:$IMAGE_TAG
          sudo buildah --no-cache --isolation=chroot build -t $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          sudo buildah push $ECR_REGISTRY/$ECR_REPOSITORY:$GIT_TAG
          sudo buildah push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      - name: Upload BOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bom
          path: |
            ${{ github.workspace }}/adapter-pkfare-server/build/reports/bom.json
      - name: Check out ArgoCD repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_PUSH }}
          repository: verteiltech/gitops-preprod
          ref: master
      - name: Update Docker image version in ArgoCD repository
        run: |
          perl -pi -e 's/adapter-pkfare-db-migration:[A-Za-z0-9]+$/adapter-pkfare-db-migration:'"$GIT_TAG"'/g' SANDBOX/qa-services/shared/v1-connectors/adapter-pkfare.yaml
          perl -pi -e 's/adapter-pkfare:[A-Za-z0-9]+$/adapter-pkfare:'"$GIT_TAG"'/g' SANDBOX/qa-services/shared/v1-connectors/adapter-pkfare.yaml
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git commit -am "Update docker image version $GIT_TAG for adapter-pkfare service in QA cluster"
          git push origin master
  publish_bom:
    name: publish bom
    uses: verteiltech/platform/.github/workflows/publish_dependency_tracker.yaml@v1
    needs: build
    secrets: inherit