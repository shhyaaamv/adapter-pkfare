name: Build and push branch to ECR
on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Docker tag'
        required: true
        type: string
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: 'ap-south-1'
  APP_DOMAIN: vdc-repository
  DOMAIN_OWNER: 683455398069

jobs:
  release-version:
    runs-on: self-hosted-arm64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_PUSH }}
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 25
      - name: Gradle Build
        run: |
          export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain $APP_DOMAIN --domain-owner $DOMAIN_OWNER --query authorizationToken --output text)
          ./gradlew clean build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Git Tag version
        run: echo "GIT_TAG=`echo $(git symbolic-ref --short HEAD)`" >> $GITHUB_ENV
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: prod-adapter-pkfare
        run: |
          aws ecr get-login-password --region ap-south-1 | sudo buildah login --username AWS --password-stdin 683455398069.dkr.ecr.ap-south-1.amazonaws.com
          sudo buildah --no-cache --isolation=chroot build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.event.inputs.tag_version }} .
          sudo buildah push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.event.inputs.tag_version }}